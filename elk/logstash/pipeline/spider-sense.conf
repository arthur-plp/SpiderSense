# Logs of the Spider Sense app (lib/server/logger.ts): JSON arrays POSTed on
# :8080, one event per element. Field names follow the Elastic Common Schema.
input {
  http {
    port => 8080
    codec => json
    # Our ECS fields (url.path, http.*) come from the app, not from this HTTP hop.
    ecs_compatibility => disabled
  }
}

filter {
  # Metadata of the HTTP hop between the app and Logstash: noise for the dashboards.
  mutate { remove_field => ["headers", "host"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # One index per day; the index template (npm run elk:setup) types the fields.
    index => "spidersense-%{+YYYY.MM.dd}"
  }
}
