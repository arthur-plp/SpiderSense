services:
  app:
    build: .
    image: spider-sense
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spidersense}:${POSTGRES_PASSWORD:-spidersense}@db:5432/${POSTGRES_DB:-spidersense}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Catches every outgoing mail in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spidersense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spidersense}
      POSTGRES_DB: ${POSTGRES_DB:-spidersense}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Monitoring (ELK): docker compose --profile elk up -d, then npm run elk:setup -----------
  # The app ships its logs (requests, domain events, errors) to Logstash when
  # LOGSTASH_URL is set; Kibana shows them on http://localhost:5601.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["elk"]
    environment:
      discovery.type: single-node
      # Development only: no authentication, no TLS.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    profiles: ["elk"]
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.monitoring.enabled: "false"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      # HTTP input: the app POSTs JSON arrays of log entries.
      - "${LOGSTASH_HTTP_PORT:-8090}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["elk"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: fr-FR
      # Demo: no telemetry banner, no warning about the (deliberately) unsecured cluster.
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false"
      XPACK_SECURITY_SHOWINSECURECLUSTERWARNING: "false"
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
