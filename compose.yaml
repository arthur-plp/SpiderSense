services:
  app:
    build: .
    image: spider-sense
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spidersense}:${POSTGRES_PASSWORD:-spidersense}@db:5432/${POSTGRES_DB:-spidersense}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Catches every outgoing mail in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spidersense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spidersense}
      POSTGRES_DB: ${POSTGRES_DB:-spidersense}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
